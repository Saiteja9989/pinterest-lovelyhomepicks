name: Post Pinterest Pin

on:
  schedule:
    # All times in UTC. US Eastern = UTC-4 (EDT, March-Nov)
    # Posting 10 pins/day at US peak hours

    # Morning (7:00 AM - 8:30 AM EDT)
    - cron: '0 11 * * *'    # 7:00 AM EDT
    - cron: '30 11 * * *'   # 7:30 AM EDT
    - cron: '0 12 * * *'    # 8:00 AM EDT
    - cron: '30 12 * * *'   # 8:30 AM EDT

    # Evening Peak (7:00 PM - 11:30 PM EDT)
    - cron: '0 23 * * *'    # 7:00 PM EDT
    - cron: '30 23 * * *'   # 7:30 PM EDT
    - cron: '0 0 * * *'     # 8:00 PM EDT
    - cron: '30 0 * * *'    # 8:30 PM EDT
    - cron: '0 1 * * *'     # 9:00 PM EDT
    - cron: '30 1 * * *'    # 9:30 PM EDT

  workflow_dispatch:  # Allow manual trigger for testing

concurrency:
  group: post-pin
  cancel-in-progress: false  # Queue runs, never cancel — prevents duplicate posts

jobs:
  post_pin:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Needed to commit updated pins_queue.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest queue before posting
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase

      - name: Post next pin
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python post_pin.py

      - name: Commit updated pins_queue_new.json
        run: |
          git add pins_queue_new.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Mark pin as posted [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
